[pytest]
pythonpath = src
testpaths = tests
addopts = -m "not integration"
markers =
    integration: slow tests that need Kafka, Spark or Docker (deselected by default)
    sanity: fast end-to-end sanity test of a finished phase on the mock data (runs by default)
filterwarnings =
    ignore:distutils Version classes are deprecated:DeprecationWarning:pyspark
    ignore:is_datetime64tz_dtype is deprecated:DeprecationWarning:pyspark
    ignore:read_text is deprecated:DeprecationWarning:kafka.protocol.schemas.load_json
    ignore:open_text is deprecated:DeprecationWarning:importlib.resources._legacy
